<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>S5 browser Web Worker qualification</title>
  </head>
  <body>
    <main data-framework="webworker">
      <h1>Browser Web Worker qualification</h1>
      <p id="status">starting worker</p>
      <ul id="grid"></ul>
    </main>
    <script>
      ;(function () {
        window.__workerResults = []
        window.__workerErrors = []
        window.__workerRequests = []

        var grid = document.getElementById('grid')
        var status = document.getElementById('status')
        var worker = new Worker('./worker.js')

        worker.onmessage = function (event) {
          var data = event.data || {}
          if (!data.ok) {
            window.__workerErrors.push(data.error || 'unknown worker error')
            status.textContent = 'worker failed'
            return
          }
          window.__workerResults = data.results
          data.results.forEach(function (entry) {
            var item = document.createElement('li')
            item.setAttribute('data-style', entry.style)
            var img = document.createElement('img')
            img.setAttribute('data-worker-style', entry.style)
            img.setAttribute('alt', entry.style)
            img.src =
              'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(entry.svg)
            item.appendChild(img)
            grid.appendChild(item)
          })
          status.textContent = 'worker produced ' + data.results.length + ' avatars'
          document.documentElement.setAttribute('data-worker-ready', 'true')
        }

        worker.onerror = function (event) {
          window.__workerErrors.push(
            'worker.onerror: ' + (event.message || 'unknown') + ' @ ' + (event.filename || '?'),
          )
          status.textContent = 'worker error'
        }

        worker.postMessage({
          seed: 'preview-output',
          name: '7even',
          px: 80,
        })
      })()
    </script>
  </body>
</html>
