<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>S5 negative control: hydration mismatch</title>
  </head>
  <body>
    <main data-control="hydration-mismatch">
      <img id="target" alt="" src="data:image/svg+xml;charset=utf-8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%201%201%22%3E%3Crect%20width%3D%221%22%20height%3D%221%22%2F%3E%3C%2Fsvg%3E" />
    </main>
    <script>
      // Deliberately changes the client-rendered bytes after the no-JS snapshot.
      // The qualification checker must detect this as a hydration mismatch.
      ;(function () {
        var image = document.getElementById('target')
        var prefix = 'data:image/svg+xml;charset=utf-8,'
        var svg = decodeURIComponent(image.getAttribute('src').slice(prefix.length))
        var mutated = svg.replace('width="1"', 'width="2"')
        image.setAttribute('src', prefix + encodeURIComponent(mutated))
        document.documentElement.setAttribute('data-hydration-mutated', 'true')
      })()
    </script>
  </body>
</html>
