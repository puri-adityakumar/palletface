<!doctype html>
<html lang="en">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>dither-face browser example</title>
  <img id="avatar" alt="Ada's pixel avatar" width="96" height="96">
  <!-- Run npm run build:web first; this example also works from file://. -->
  <script src="../../dist/dither-face.js"></script>
  <script>
    const svg = DitherFace.ditherFace('ada-123', { style: 'pixel-sprite', px: 96, name: 'Ada' })
    document.querySelector('#avatar').src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg)
  </script>
</html>
