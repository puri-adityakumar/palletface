name: Feature request
description: Discuss an improvement before implementation
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution and alternatives
      description: Explain any impact on API size, dependencies, or existing avatar output.
    validations:
      required: true
