name: Release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag, for example v1.0.0
        required: true
        type: string
      dist-tag:
        description: npm distribution tag; releases use latest
        required: true
        default: latest
        type: string
      release-branch:
        description: Branch containing the reviewed release commit
        required: true
        default: main
        type: string
permissions:
  contents: read
concurrency:
  group: npm-release
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/check-release.mjs
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_BRANCH: ${{ inputs.release-branch }}
      - id: source
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - run: npm run check:all
  publish:
    needs: check
    runs-on: ubuntu-latest
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check.outputs.commit }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm stage publish --tag "$NPM_DIST_TAG" --access public
        env:
          NPM_DIST_TAG: ${{ inputs.dist-tag }}
